<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KVT — Page introuvable</title>
  <style>
    :root { --bg:#0e1524; --card:#152036; --text:#e8edf7; --muted:#9fb0cc; --accent:#4da3ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:var(--bg); color:var(--text);
           font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
    .card { text-align:center; padding:48px 40px; max-width:520px; }
    .kanji { font-size:64px; color:var(--accent); margin-bottom:8px; }
    h1 { font-size:22px; margin:0 0 12px; }
    p { color:var(--muted); line-height:1.6; margin:0 0 24px; }
    a { display:inline-block; background:var(--accent); color:#08111f; text-decoration:none;
        font-weight:600; padding:12px 22px; border-radius:10px; }
  </style>
</head>
<body>
  <header class="kvt-topbar">
    <div class="kvt-topbar__inner">
      <a class="kvt-topbar__brand" href="/" aria-label="KVT — retour à la page d'accueil">
        <div class="brand-kanji">漢</div>
        <div class="brand-text">KVT</div>
      </a>
      <button class="kvt-topbar__toggle" type="button" aria-expanded="false" aria-controls="navPrincipale">Menu</button>
      <nav class="kvt-topbar__nav" id="navPrincipale" aria-label="Navigation principale">
        <a href="/l-idee">L'idée</a>
        <a href="/a-propos">À propos</a>
        <a href="/faq">FAQ</a>
        <a href="/blog">Blog</a>
        <a href="/regles-de-publication">Règles de publication</a>
      </nav>
      <div class="kvt-topbar__end">
        <a class="kvt-topbar__cta" href="/app/" style="padding:8px 14px;border-radius:9px;background:var(--accent);color:var(--sur-accent,#fff);text-decoration:none;font-size:13.5px;font-weight:600;white-space:nowrap">Ouvrir l'app</a>
      </div>
    </div>
  </header>

  <div class="card">
    <div class="kanji">漢</div>
    <h1>Page ou fichier introuvable</h1>
    <p>Ce lien ne pointe vers rien. Si tu essayais de télécharger l'application,
       le fichier n'est peut-être pas disponible pour le moment.</p>
    <a href="/">Retour à l'accueil KVT</a>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/supabaseClient.js"></script>
  <script src="/mesure.js"></script>
  <script src="/ui.js"></script>
</body>
</html>
