# netlify.toml — KVT web (kanji-vocab-trainer-web)
#
# Structure du site depuis le 27/07/2026 :
#   /                       accueil communauté (avis, decks, mises à jour)
#   /l-idee                 l'ancienne page de présentation, devenue secondaire
#   /app                    l'application elle-même
#   /a-propos /faq /blog/*  pages éditoriales, vrais dossiers
#   /downloads/*            ancienne adresse des binaires : ils sont
#                           desormais sur les Releases GitHub
#
# Principe Netlify : un fichier statique existant est TOUJOURS servi avant une
# règle non forcée, et la première règle qui correspond gagne. L'ordre compte.

# 1) Anciens liens de téléchargement. Les binaires ne sont plus hébergés ici :
#    ils pesaient 166 Mo sur 168 et repartaient à chaque déploiement. On
#    redirige vers les Releases GitHub pour que les liens déjà partagés
#    continuent de fonctionner.
[[redirects]]
  from = "/downloads/:fichier"
  to = "https://github.com/KVTADM/kanji-vocab-trainer-web/releases/latest/download/:fichier"
  status = 302
  force = true

# 2) La racine SERT l'application. Jusqu'au 03/08/2026 un `index.html` séparé
#    vivait ici : c'était la maquette d'origine, restée en place alors que la
#    page d'accueil était devenue le premier onglet de l'app. Les deux
#    affichaient exactement les mêmes cinq sections, avec deux codes
#    différents — et c'est la version morte que voyait le visiteur. Elle est
#    supprimée ; la racine réécrit vers l'app, sans redirection visible, pour
#    que l'adresse partagée reste « / ».
[[redirects]]
  from = "/"
  to = "/app/index.html"
  status = 200

# 3) Ancienne adresse de la présentation, devenue secondaire. Redirection
#    permanente pour ne pas casser les liens déjà partagés.
[[redirects]]
  from = "/decouvrir"
  to = "/l-idee"
  status = 301

[[redirects]]
  from = "/decouvrir/*"
  to = "/l-idee"
  status = 301

# 4) Filet pour l'app. Elle n'a aucun routage côté client aujourd'hui (aucun
#    pushState), donc cette règle ne sert qu'à éviter un 404 sur une sous-adresse
#    tapée à la main. À conserver si un vrai routage arrive un jour.
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Volontairement PAS de catch-all "/* -> /index.html" : une adresse inconnue
# doit donner un vrai 404, pas la page de présentation. Un catch-all masquerait
# les liens cassés au lieu de les révéler.
