<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>KVT</title>

<!-- PWA : installable sur iPhone/iPad via Safari > Partager > Sur l'écran d'accueil -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#16162a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="KVT" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />

<link rel="stylesheet" href="style.css" />

<!-- Google AdSense : vérification de propriété du site -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8318848112615285"
     crossorigin="anonymous"></script>
</head>
<body>
  <div class="app">
    <nav class="sidebar">
      <div class="brand">
        <div class="brand-kanji">漢</div>
        <div class="brand-text">KVT</div>
      </div>
      <button class="nav-btn active" data-view="dashboard">Tableau de bord</button>
      <button class="nav-btn" data-view="manage">Vocabulaire</button>
      <button class="nav-btn" data-view="learn">Apprendre</button>
      <button class="nav-btn" data-view="stats">Statistiques</button>
      <button class="nav-btn" data-view="download">Applications</button>
      <button class="nav-btn" data-view="settings">Réglages</button>
      <button class="nav-btn" data-view="account">Compte</button>
      <button class="nav-btn" data-view="leaderboard">Classement</button>
      <button class="nav-btn" data-view="admin" id="navAdmin" style="display:none;">Admin</button>
      <div class="sidebar-footer" id="weekBadge"></div>
    </nav>
    <main class="content">
      <section id="view-dashboard" class="view active"></section>
      <section id="view-manage" class="view"></section>
      <section id="view-learn" class="view"></section>
      <section id="view-review" class="view"></section>
      <section id="view-stats" class="view"></section>
      <section id="view-download" class="view"></section>
      <section id="view-settings" class="view"></section>
      <section id="view-account" class="view"></section>
      <section id="view-leaderboard" class="view"></section>
      <section id="view-admin" class="view"></section>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabaseClient.js"></script>
  <script src="webapi.js"></script>
  <script src="app.js"></script>
  <script src="account.js"></script>
  <script src="ads.js"></script>
  <script src="leaderboard.js"></script>
  <script src="admin.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
